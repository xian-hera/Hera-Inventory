# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5a8b9ed20cfb65d0e88463bf3975ee50"
application_url = "https://hera-inventory.onrender.com"
embedded = true
name = "Hera Hub"

[webhooks]
api_version = "2026-04"

  # Employee Discount (2026-11-12): when an employee pays / gets a refund /
  # an order is cancelled, Hub recounts her season spend and updates the
  # customer metafield the discount Function reads. Signed with the app
  # secret (X-Shopify-Hmac-Sha256). See claude/EMPLOYEE_DISCOUNT.md.
  [[webhooks.subscriptions]]
  topics = [ "orders/paid", "orders/cancelled", "refunds/create" ]
  uri = "https://hera-inventory.onrender.com/webhooks/shopify"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_discounts added 2026-11-12 (Employee Discount: Hub creates / updates the automatic discount)
scopes = "read_all_orders,read_customers,write_customers,read_discounts,write_discounts,read_files,write_files,write_inventory,read_inventory,write_inventory_shipments,read_inventory_shipments,write_inventory_transfers,read_inventory_transfers,read_locations,read_orders,read_products,write_products,read_publications,write_publications,read_store_credit_account_transactions,write_store_credit_account_transactions,read_store_credit_accounts,read_translations,write_app_proxy,write_inventory_shipments_received_items,read_inventory_shipments_received_items"
use_legacy_install_flow = false

# Wig Try-on (2026-11-05): storefront widget -> Hub. herabeauty.ca/apps/hera-tryon/* is
# forwarded (signed, with logged_in_customer_id) to the Hub route /proxy/wig-tryon/*.
# Needs the write_app_proxy scope above. See claude/WIG_TRYON_FEATURE_SPEC.md.
[app_proxy]
url = "https://hera-inventory.onrender.com/proxy/wig-tryon"
prefix = "apps"
subpath = "hera-tryon"

[auth]
redirect_urls = [ "https://hera-inventory.onrender.com/auth/callback" ]
