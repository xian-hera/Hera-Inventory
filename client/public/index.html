<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>React App</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body, #root {
        max-width: 100vw;
        overflow-x: hidden;
      }
      /* 2026-09-17, Hera: Buyer Wig Demo 页面展开/折叠 location 卡片时，页面内容会左右
         偏移几像素。用内置浏览器实测确认：上面这条 overflow-x: hidden 规则按 CSS 规范会让
         body 的 overflow-y 隐式变成 auto（浏览器在一个方向设了非 visible、另一个方向没设时
         的标准行为），而 body 本身又被 Polaris 的基础样式设成 height: 100%/min-height: 100%
         （视口高度）——这就让 body 变成了一个独立于 <html> 之外、自己会出现/消失竖向滚动条的
         嵌套滚动容器：卡片展开、内容超过视口高度时，body 自己的滚动条出现，瞬间吃掉约 15px
         宽度，页面整体左移；折叠回去滚动条消失，又弹回右边。<html> 本身另有一条固定显示的
         滚动条（宽度不随内容变化，不是这次问题的原因）。下面这条规则让 body 的这条滚动条也始终
         占住位置，不再随内容高度增减而出现/消失，从而消除这个偏移。已经在浏览器里注入这条规则
         实测过展开/折叠多次，确认偏移完全消失后才写回代码。 */
      body {
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }
      /* 2026-09-18, Hera: Manager 端 Wig DEMO 页面在 Android 上用 Shopify 自带的 app
         打开时，页面最下面一张卡片会被 Shopify 原生的底部按钮/导航条挡住、点不到。这条
         底部按钮是 Shopify app 自己画在页面上面的原生 UI，不是这个网页的一部分，我们这边
         没办法去改它的大小或者位置，只能反过来在网页内容的最底部留出一段固定空间，把最后
         一张卡片"顶"上去，让它不会被挡住。只在手机宽度的屏幕上生效（768px 是 Polaris 自己
         用的手机/桌面断点，跟其它地方保持一致），桌面浏览器打开不受影响。用到这个类的地方
         见 ManagerWigDemo.js 页面最下面的 spacer。 */
      @media (max-width: 767px) {
        .wig-demo-mobile-bottom-safe-area {
          height: 96px;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
